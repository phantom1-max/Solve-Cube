name: Flutter CI and platform builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform projects
        run: flutter create --platforms=android,ios,web,windows,macos,linux --org app.solvecube .
      - name: Format Dart sources
        run: dart format lib test
      - name: Commit formatter changes
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- lib test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "style: format Dart sources"
            git push
          fi
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: ios
            os: macos-latest
          - target: macos
            os: macos-latest
          - target: windows
            os: windows-latest
          - target: linux
            os: ubuntu-latest
          - target: web
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Generate target platform project
        shell: bash
        run: flutter create --platforms=android,ios,web,windows,macos,linux --org app.solvecube .
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android APK
        if: matrix.target == 'android'
        run: flutter build apk --release
      - name: Build iOS app (unsigned)
        if: matrix.target == 'ios'
        run: flutter build ios --release --no-codesign
      - name: Build macOS app
        if: matrix.target == 'macos'
        run: flutter build macos --release
      - name: Build Windows app
        if: matrix.target == 'windows'
        run: flutter build windows --release
      - name: Build Linux app
        if: matrix.target == 'linux'
        run: flutter build linux --release
      - name: Build web app
        if: matrix.target == 'web'
        run: flutter build web --release
      - name: Upload Android APK
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: solve-cube-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload iOS app
        if: matrix.target == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: solve-cube-ios
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS app
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: solve-cube-macos
          path: build/macos/Build/Products/Release/solve_cube.app
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows app
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: solve-cube-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux app
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: solve-cube-linux
          path: build/linux/x64/release/bundle
          if-no-files-found: error
          retention-days: 14
      - name: Upload Web build
        if: matrix.target == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: solve-cube-web
          path: build/web
          if-no-files-found: error
          retention-days: 14

  deploy-web:
    if: github.event_name != 'pull_request'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: solve-cube-web
          path: web
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  publish-prerelease:
    if: github.event_name != 'pull_request'
    needs: [test, build, deploy-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: solve-cube-*
          path: dist
          merge-multiple: false
      - name: Validate all platform artifacts and create ZIP packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          ANDROID_APK="$(find dist/solve-cube-android -type f -name app-release.apk -print -quit)"
          test -n "$ANDROID_APK"
          test -s "$ANDROID_APK"
          cp "$ANDROID_APK" release/Solve-Cube-Android.apk
          (cd dist/solve-cube-android && zip -qr ../../release/Solve-Cube-Android.zip .)

          for target in ios macos windows linux web; do
            test -d "dist/solve-cube-$target"
            test -n "$(find "dist/solve-cube-$target" -mindepth 1 -print -quit)"
            (cd "dist/solve-cube-$target" && zip -qr "../../release/Solve-Cube-$target.zip" .)
          done

          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 7
          for archive in release/*.zip; do unzip -t "$archive"; done
          ls -lh release

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: Solve Cube v${{ steps.app_version.outputs.version }} - Platform Preview
          prerelease: true
          generate_release_notes: true
          files: release/*
